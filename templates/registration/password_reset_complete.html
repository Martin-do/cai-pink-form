{% extends "base.html" %}
{% load static %}
{% block title %}Password Updated – {{ DIOCESE_NAME }}{% endblock %}
{% block shell %}
<div class="auth-center-shell">
  <div class="auth-card" style="text-align:center">
    <div style="margin-bottom:.75rem"><span class="badge badge-submitted">Password updated</span></div>
    <h1 style="font-size:1.3rem;margin-bottom:.4rem">Your password has been reset</h1>
    <p class="muted small" style="margin:0 0 1.35rem">You can now sign in with your new password.</p>
    <a class="btn btn-primary btn-sm" href="{% url 'login' %}">Sign in to portal</a>
  </div>
</div>
{% endblock %}
