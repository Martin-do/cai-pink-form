{% extends "base.html" %}
{% load static %}
{% block title %}Reset Link Sent – {{ DIOCESE_NAME }}{% endblock %}
{% block shell %}
<div class="auth-center-shell">
  <div class="auth-card" style="text-align:center">
    <img src="{% static 'img/archdiocese-emblem.png' %}" alt="Archdiocese Emblem" style="width:52px;height:52px;border-radius:50%;border:1.5px solid var(--gold-400);margin-bottom:.9rem">
    <h1 style="font-size:1.3rem;margin-bottom:.4rem">Check your email</h1>
    <p class="muted small" style="margin:0 0 1.35rem">If an account exists with the email you entered, password reset instructions have been sent.</p>
    <a class="btn btn-primary btn-sm" href="{% url 'login' %}">Return to sign in</a>
  </div>
</div>
{% endblock %}
